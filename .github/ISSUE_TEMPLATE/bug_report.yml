name: Bug report
description: Report a reproducible software, parser, export, or interface problem.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve ConfoVHH. **Do not upload unpublished, confidential, patient-derived, proprietary, or laboratory-restricted structures or sequences.** Use a minimal synthetic example or an already public accession whenever possible.
  - type: checkboxes
    id: privacy
    attributes:
      label: Data boundary
      options:
        - label: I confirm this report contains no private structure, sequence, PAE matrix, access token, or confidential laboratory material.
          required: true
  - type: input
    id: version
    attributes:
      label: Product version and commit
      description: Copy the product version from the app header and, for a local run, the full Git commit.
      placeholder: product 0.9.1; commit 40-hex SHA
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - PDB or mmCIF parsing
        - Chain assignment
        - Interface geometry or SASA
        - IMGT numbering
        - PAE association or display
        - Pose ensemble
        - Paired context
        - Export or provenance
        - Browser interface or accessibility
        - Build, test, or documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Give exact steps and identify any public accession or synthetic fixture. Do not attach private data.
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: checkboxes
    id: claim
    attributes:
      label: Scientific interpretation
      options:
        - label: I understand that ConfoVHH audits supplied coordinates and does not establish binding, affinity, specificity, function, state selectivity, membrane compatibility, or pose correctness.
          required: true
