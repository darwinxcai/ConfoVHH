name: Pin Vercel Nitro adapter

on:
  push:
    branches:
      - fix/vercel-native-next-build-20260901

permissions:
  contents: write

jobs:
  pin-nitro:
    if: ${{ !contains(github.event.head_commit.message, 'Pin Nitro Vercel adapter') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x
      - name: Pin the Nitro adapter used by current vinext
        run: npm install --save-dev --save-exact 'nitro@npm:nitro-nightly@latest'
      - name: Commit deterministic dependency metadata
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "Nitro dependency is already pinned."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Pin Nitro Vercel adapter"
          git push origin "HEAD:${GITHUB_REF_NAME}"
