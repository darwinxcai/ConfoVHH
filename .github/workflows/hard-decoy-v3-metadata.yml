name: Hard-decoy v3 metadata census

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/hard-decoy/stage-v3-metadata-inputs.mjs
      - scripts/hard-decoy/oracle/canonical-json.mjs
      - scripts/hard-decoy/v3-source-universe.mjs
      - scripts/hard-decoy/verify-v3-census-contracts.mjs
      - validation/hard-decoy-holdout-v3/prelabel-census-draft/README.md
      - validation/hard-decoy-holdout-v3/prelabel-census-draft/annotation-epitope-ontology.json
      - validation/hard-decoy-holdout-v3/prelabel-census-draft/checksums.sha256
      - validation/hard-decoy-holdout-v3/prelabel-census-draft/disposition-contract.json
      - validation/hard-decoy-holdout-v3/prelabel-census-draft/source-query-contract.json
      - validation/hard-decoy-holdout-v3/prelabel-census-draft/state.json
      - validation/hard-decoy-holdout-v3/source-snapshot-2026-08-29/**
      - .github/workflows/hard-decoy-v3-metadata.yml

permissions:
  contents: read

concurrency:
  group: hard-decoy-v3-metadata-${{ github.ref }}
  cancel-in-progress: false

jobs:
  metadata-census:
    name: Reconstruct metadata-only source universe
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Use Node.js 22.18
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.18.0

      - name: Bootstrap and materialize exact metadata inputs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          STAGER_SHA256: 132ce5ed0e7780e978c09035d924ff50352d29c4a827c8434d46f60ba828981e
          STAGER_PATH: ${{ runner.temp }}/confovhh-v3-bootstrap/stage-v3-metadata-inputs.mjs
          STAGE_ROOT: ${{ runner.temp }}/confovhh-v3-source-inputs
          STAGE_RECEIPT: ${{ runner.temp }}/confovhh-v3-source-inputs-receipt.json
        run: |
          test -z "$(find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -print -quit)"
          mkdir -p "$(dirname "$STAGER_PATH")"
          node --input-type=module <<'NODE'
          import { createHash } from "node:crypto";
          import { open } from "node:fs/promises";
          const url = `https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/contents/scripts/hard-decoy/stage-v3-metadata-inputs.mjs?ref=${process.env.GITHUB_SHA}`;
          const response = await fetch(url, {
            headers: {
              accept: "application/vnd.github.raw+json",
              authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
              "user-agent": "confovhh-v3-metadata-bootstrap/1",
              "x-github-api-version": "2022-11-28",
            },
            redirect: "error",
            signal: AbortSignal.timeout(60_000),
          });
          if (!response.ok || !response.body) throw new Error(`Stager bootstrap failed with HTTP ${response.status}.`);
          const chunks = [];
          let total = 0;
          for await (const chunk of response.body) {
            total += chunk.byteLength;
            if (total > 512 * 1024) throw new Error("Stager bootstrap exceeded 512 KiB.");
            chunks.push(Buffer.from(chunk));
          }
          const bytes = Buffer.concat(chunks, total);
          const actual = createHash("sha256").update(bytes).digest("hex");
          if (actual !== process.env.STAGER_SHA256) throw new Error(`Stager digest mismatch: ${actual}`);
          const handle = await open(process.env.STAGER_PATH, "wx", 0o400);
          try { await handle.writeFile(bytes); await handle.sync(); } finally { await handle.close(); }
          NODE
          node "$STAGER_PATH" stage source-universe "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$STAGE_ROOT" "$STAGE_RECEIPT"
          test ! -e "$STAGE_ROOT/.git"

      - name: Verify exact read-only staged inputs
        env:
          STAGER_PATH: ${{ runner.temp }}/confovhh-v3-bootstrap/stage-v3-metadata-inputs.mjs
          STAGE_ROOT: ${{ runner.temp }}/confovhh-v3-source-inputs
          STAGE_RECEIPT: ${{ runner.temp }}/confovhh-v3-source-inputs-receipt.json
        run: node "$STAGER_PATH" verify source-universe "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$STAGE_ROOT" "$STAGE_RECEIPT"

      - name: Verify census contracts and replay retained source bytes
        env:
          STAGE_ROOT: ${{ runner.temp }}/confovhh-v3-source-inputs
        run: |
          node "$STAGE_ROOT/scripts/hard-decoy/verify-v3-census-contracts.mjs" "$STAGE_ROOT"
          node "$STAGE_ROOT/scripts/hard-decoy/v3-source-universe.mjs" verify "$STAGE_ROOT/validation/hard-decoy-holdout-v3/source-snapshot-2026-08-29" "$STAGE_ROOT"

      - name: Capture repeated public metadata responses
        env:
          STAGE_ROOT: ${{ runner.temp }}/confovhh-v3-source-inputs
          OUTPUT_ROOT: ${{ runner.temp }}/confovhh-hard-decoy-v3-source
        run: node "$STAGE_ROOT/scripts/hard-decoy/v3-source-universe.mjs" collect "$OUTPUT_ROOT" "$STAGE_ROOT"

      - name: Replay captured metadata bytes and reverify staged inputs
        env:
          STAGER_PATH: ${{ runner.temp }}/confovhh-v3-bootstrap/stage-v3-metadata-inputs.mjs
          STAGE_ROOT: ${{ runner.temp }}/confovhh-v3-source-inputs
          STAGE_RECEIPT: ${{ runner.temp }}/confovhh-v3-source-inputs-receipt.json
          OUTPUT_ROOT: ${{ runner.temp }}/confovhh-hard-decoy-v3-source
        run: |
          node "$STAGE_ROOT/scripts/hard-decoy/v3-source-universe.mjs" verify "$OUTPUT_ROOT" "$STAGE_ROOT"
          node "$STAGER_PATH" verify source-universe "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$STAGE_ROOT" "$STAGE_RECEIPT"

      - name: Upload checksummed metadata snapshot and staging receipt
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: confovhh-hard-decoy-v3-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/confovhh-hard-decoy-v3-source/
            ${{ runner.temp }}/confovhh-v3-source-inputs-receipt.json
          if-no-files-found: error
          retention-days: 30
