name: Hard-decoy v3 monotonic definite exclusions

on:
  push:
    branches:
      - "work/hard-decoy-v3-definite-exclusions-*"
    paths:
      - ".github/workflows/v3-definite-exclusions.yml"
      - "scripts/hard-decoy/v3-definite-exclusions.mjs"
      - "scripts/hard-decoy/v3-disposition-seed.mjs"
      - "scripts/hard-decoy/v3-exact-evidence-pregraph.mjs"
      - "tests/hard-decoy-v3-definite-exclusions*.test.mjs"
      - "validation/hard-decoy-holdout-v3/definite-exclusion-contract-2026-08-29.json"
      - "validation/hard-decoy-holdout-v3/disposition-seed-2026-08-29/**"
      - "validation/hard-decoy-holdout-v3/exact-evidence-pregraph-2026-08-29/**"
      - "validation/hard-decoy-holdout-v3/EXACT_EVIDENCE_PREGRAPH_ATTESTATION_2026-08-29.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hard-decoy-v3-definite-exclusions-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate-verify-and-record:
    name: Derive and verify monotonic exact-evidence exclusions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Use Node.js 22.18
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.18.0
      - name: Verify authoritative v3 integration boundary
        run: |
          node scripts/hard-decoy-v3/verify-integration-state.mjs
          node --test tests/hard-decoy-v3-integration-state.test.mjs
      - name: Verify prior seed and exact-evidence pregraph
        run: |
          node scripts/hard-decoy/v3-disposition-seed.mjs verify validation/hard-decoy-holdout-v3/disposition-seed-2026-08-29
          node scripts/hard-decoy/v3-exact-evidence-pregraph.mjs verify validation/hard-decoy-holdout-v3/exact-evidence-pregraph-2026-08-29
      - name: Run monotonic exclusion integrity tests
        run: node --test tests/hard-decoy-v3-definite-exclusions*.test.mjs
      - name: Generate definite-exclusion snapshot
        run: node scripts/hard-decoy/v3-definite-exclusions.mjs generate validation/hard-decoy-holdout-v3/definite-exclusion-snapshot-2026-08-29
      - name: Independently replay definite-exclusion snapshot
        run: node scripts/hard-decoy/v3-definite-exclusions.mjs verify validation/hard-decoy-holdout-v3/definite-exclusion-snapshot-2026-08-29
      - name: Upload inspectable definite-exclusion evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hard-decoy-v3-definite-exclusions
          path: validation/hard-decoy-holdout-v3/definite-exclusion-snapshot-2026-08-29
          if-no-files-found: error
          retention-days: 14
      - name: Commit verified snapshot when changed
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          output="validation/hard-decoy-holdout-v3/definite-exclusion-snapshot-2026-08-29"
          if [[ -z "$(git status --porcelain --untracked-files=all -- "$output")" ]]; then
            echo "Verified definite-exclusion snapshot is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$output"
          if git diff --cached --quiet -- "$output"; then
            echo "No definite-exclusion snapshot content was staged."
            exit 1
          fi
          git commit -m "Record monotonic v3 definite exclusions"
          git push origin "HEAD:${TARGET_BRANCH}"
