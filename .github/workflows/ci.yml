name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Release verification (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        node:
          - 22.18.0
          - 24.13.0
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run release test suite
        run: npm test
      - name: Run adversarial validation
        run: npm run test:adversarial
      - name: Lint
        run: npm run lint
      - name: Build and type-check
        run: npm run build
      - name: Validate real prediction-run regression artifact
        run: npm run validate:prediction-runs
      - name: Replay v0.5 public regression attestation
        run: node scripts/run-v05-public-regression-attestation.mjs replay
      - name: Replay DockQ v0.5 regression comparisons
        run: node scripts/run-dockq-v05-regression-replay.mjs replay
      - name: Verify release-artifact reproducibility
        run: npm run release:verify
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  coverage:
    name: Coverage gate
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Node.js 22.18
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.18.0
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Enforce coverage threshold
        run: >-
          npx c8
          --all
          --include='lib/**/*.{ts,tsx}'
          --include='app/**/*.{ts,tsx}'
          --include='worker/**/*.{ts,tsx}'
          --include='components/**/*.{ts,tsx}'
          --exclude='components/ui/**'
          --exclude='**/*.d.ts'
          --check-coverage
          --lines 83
          --branches 83
          --functions 83
          --statements 83
          node --test --test-concurrency=1 tests/*.test.mjs
      - name: Audit full dependency closure
        run: npm audit --audit-level=high

  client-boundary:
    name: Client-boundary regression guard
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Enforce bounded client imports
        run: |
          set -euo pipefail
          if grep -R -E "from ['\"]@/lib/(confovhh|geometry-fit|mmcif|pose-ensemble|research-workspace|state-pair|prediction-run-jobs|prediction-run)['\"]" app components; then
            echo "Forbidden direct client import of a heavy analysis module."
            exit 1
          fi
          if grep -R -E "from ['\"]@/lib/audit-jobs['\"]" app components | grep -v "AuditJobSnapshot"; then
            echo "Client code may import audit-jobs only for the AuditJobSnapshot type."
            exit 1
          fi
          if grep -R -E "from ['\"]@/lib/prediction-run-jobs['\"]" app components | grep -v "import type"; then
            echo "Client code may import prediction-run-jobs only as type-only metadata."
            exit 1
          fi
          if grep -R -E "from ['\"]@/lib/research-workspace['\"]" app components | grep -v "import type"; then
            echo "Client code may import research-workspace only as type-only metadata."
            exit 1
          fi
          if grep -R -E "from ['\"]@/lib/(audit-export|audit-worker|audit-worker-protocol|candidate-shortlist|coordinate-parser|pae-visualization|topology-annotation|user-footprint|vhh-numbering)['\"]" app components; then
            echo "Forbidden direct client import of an analysis or worker module."
            exit 1
          fi
          if grep -R -E "from ['\"]@/lib/prediction-run-worker['\"]" app components; then
            echo "Client code may not import the prediction-run worker runtime."
            exit 1
          fi

  build:
    name: Production build, lint, and type-check
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Node.js 22.18
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.18.0
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build and type-check
        run: npm run build
