name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-release-gate:
    name: Core release gate · Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        node: ["22.x", "24.x"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Node.js ${{ matrix.node }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install patched product dependencies
        run: npm ci
      # audit-advisories.mjs already runs `npm audit --omit=dev` itself and fails
      # on ANY advisory at or above moderate that is reachable from the
      # production tree — "never waivable", allowlisted or not. A second bare
      # `npm audit --omit=dev --audit-level=moderate` here added no coverage and
      # cost reliability: it uses the legacy quick-audit endpoint, which npm is
      # retiring, and which returned a spurious "400 Invalid package tree" on
      # Node 22 while the identical step passed on Node 24 in the same run.
      # Production coverage is unchanged; only the duplicate call is gone.
      - name: Verify dependency graph and advisories
        run: |
          npm ls --all
          node scripts/audit-advisories.mjs
      - name: Full offline release gate
        run: npm run test:release
      - name: Replay blocked hard-decoy v3 integration state
        run: |
          node scripts/hard-decoy-v3/verify-integration-state.mjs
          node --test validation/hard-decoy-holdout-v3/census-audit-2026-08-29/verify.test.mjs

  core-coverage:
    name: Core coverage
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Node.js 22.18
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.18.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            qa/package-lock.json
      - name: Install application and isolated QA dependencies
        run: |
          npm ci
          npm ci --prefix qa
      - name: Audit isolated QA dependencies
        run: npm audit --prefix qa --audit-level=moderate
      - name: Build production output for rendered-response tests
        run: npm run build
      - name: Enforce measured core coverage floors
        run: >
          ./qa/node_modules/.bin/c8
          --all
          --include='lib/**/*.ts'
          --reporter=text
          --reporter=lcov
          --check-coverage
          --statements=60
          --lines=60
          --branches=80
          --functions=50
          node --test --test-concurrency=1 tests/*.test.mjs
      - name: Upload coverage report
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: core-coverage
          path: coverage/lcov.info
          if-no-files-found: ignore
          retention-days: 14

  chromium-acceptance:
    name: Chromium acceptance and accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Node.js 22.18
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.18.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            qa/package-lock.json
      - name: Install application and isolated QA dependencies
        run: |
          npm ci
          npm ci --prefix qa
      - name: Install Chromium runtime
        run: ./qa/node_modules/.bin/playwright install --with-deps chromium
      - name: Build production application
        run: npm run build
      - name: Run browser and WCAG A/AA acceptance
        run: npm --prefix qa test
      - name: Upload browser diagnostics
        if: failure() && !cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chromium-acceptance
          path: |
            qa/playwright-report/
            qa/test-results/
          if-no-files-found: ignore
          retention-days: 14

  public-producer-regression:
    name: Exact public producer-output regression
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Node.js 22.18
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.18.0
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install patched product dependencies
        run: npm ci
      - name: Verify immutable producer bytes and all pose/PAE audits
        run: node scripts/validate-real-prediction-runs.mjs --verify=validation/real-prediction-run-regression-v1.json --quiet
