name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-release-gate:
    name: Core release gate · Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        node: ["22.18.0", "24.x"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Node.js ${{ matrix.node }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install frozen scientific-engine dependencies
        run: npm ci
      - name: Full offline release gate
        run: npm run test:release

  core-coverage:
    name: Core coverage
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Node.js 22.18
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.18.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            qa/package-lock.json
      - name: Install application and isolated QA dependencies
        run: |
          npm ci
          npm ci --prefix qa
      - name: Audit isolated QA dependencies
        run: npm audit --prefix qa --audit-level=high
      - name: Build production output for rendered-response tests
        run: npm run build
      - name: Enforce measured core coverage floors
        run: >
          ./qa/node_modules/.bin/c8
          --all
          --include='lib/**/*.ts'
          --reporter=text
          --reporter=lcov
          --check-coverage
          --statements=60
          --lines=60
          --branches=80
          --functions=50
          node --test tests/*.test.mjs
      - name: Upload coverage report
        if: always() && !cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: core-coverage
          path: coverage/lcov.info
          if-no-files-found: ignore
          retention-days: 14

  chromium-acceptance:
    name: Chromium acceptance and accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Node.js 22.18
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.18.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            qa/package-lock.json
      - name: Install application and isolated QA dependencies
        run: |
          npm ci
          npm ci --prefix qa
      - name: Install Chromium runtime
        run: ./qa/node_modules/.bin/playwright install --with-deps chromium
      - name: Build production application
        run: npm run build
      - name: Run browser and WCAG A/AA acceptance
        run: npm --prefix qa test
      - name: Upload browser diagnostics
        if: always() && !cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chromium-acceptance
          path: |
            qa/playwright-report/
            qa/test-results/
          if-no-files-found: ignore
          retention-days: 14

  public-producer-regression:
    name: Exact public producer-output regression
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Node.js 22.18
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.18.0
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install frozen scientific-engine dependencies
        run: npm ci
      - name: Verify immutable producer bytes and all pose/PAE audits
        run: node scripts/validate-real-prediction-runs.mjs --verify=validation/real-prediction-run-regression-v1.json --quiet
