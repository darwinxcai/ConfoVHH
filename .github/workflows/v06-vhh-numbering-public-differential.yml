name: V0.6 VHH numbering public differential

on:
  push:
    branches:
      - accuracy/vhh-numbering-v06-candidate-20260901

permissions:
  contents: write

concurrency:
  group: v06-vhh-numbering-public-differential-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-public-differential:
    if: ${{ !contains(github.event.head_commit.message, 'Record v0.6 VHH numbering public differential') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out candidate branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Use Node.js 22.18
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.18.0
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install frozen dependencies
        run: npm ci
      - name: Run candidate-specific numbering regressions
        run: node --test tests/vhh-numbering-v06.test.mjs
      - name: Run SHA-pinned 17-structure public differential
        run: node scripts/run-v06-vhh-numbering-public-differential.mjs
      - name: Verify and record the derived differential artifact
        run: |
          artifact="validation/v0.6-vhh-numbering-candidate-v1/public-panel-differential.json"
          test -s "$artifact"
          git add "$artifact"
          git diff --cached --check
          changed="$(git diff --cached --name-only)"
          if [ -z "$changed" ]; then
            echo "Differential artifact already matches the reproducible run."
            exit 0
          fi
          test "$changed" = "$artifact"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Record v0.6 VHH numbering public differential"
          git push origin "HEAD:${GITHUB_REF_NAME}"
