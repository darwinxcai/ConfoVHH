name: Hard-decoy v3 VHH sequence pregraph

on:
  push:
    branches:
      - "work/hard-decoy-v3-vhh-sequence-*"
    paths:
      - ".github/workflows/v3-vhh-sequence-pregraph.yml"
      - "scripts/hard-decoy/v3-vhh-sequence-pregraph.mjs"
      - "scripts/hard-decoy/v3-exact-evidence-pregraph.mjs"
      - "scripts/hard-decoy-v3/verify-integration-state.mjs"
      - "tests/hard-decoy-v3-vhh-sequence-pregraph*.test.mjs"
      - "tests/hard-decoy-v3-integration-state.test.mjs"
      - "tests/vhh-numbering.test.mjs"
      - "validation/hard-decoy-holdout-v3/INTEGRATION_STATE_2026-08-29.json"
      - "validation/hard-decoy-holdout-v3/VHH_NUMBERING_CORRECTION_2026-08-30.json"
      - "validation/hard-decoy-holdout-v3/vhh-sequence-contract-2026-08-29.json"
      - "validation/hard-decoy-holdout-v3/vhh-sequence-pregraph-2026-08-29/**"
      - "validation/hard-decoy-holdout-v3/exact-evidence-pregraph-2026-08-29/**"
      - "validation/hard-decoy-holdout-v3/entry-metadata-snapshot-2026-08-29/entries.jsonl"
      - "validation/hard-decoy-holdout-v3/development-metadata-snapshot-2026-08-29/entities.jsonl"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hard-decoy-v3-vhh-sequence-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Replay frozen IMGT VHH sequence pregraph
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
      - name: Use Node.js 22.18
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.18.0
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install the frozen dependency closure
        run: npm ci
      - name: Verify the authoritative pre-label boundary and exact node universe
        run: |
          node scripts/hard-decoy-v3/verify-integration-state.mjs
          node --test tests/hard-decoy-v3-integration-state.test.mjs
          node scripts/hard-decoy/v3-exact-evidence-pregraph.mjs verify validation/hard-decoy-holdout-v3/exact-evidence-pregraph-2026-08-29
      - name: Independently replay the committed corrected VHH pregraph
        run: node scripts/hard-decoy/v3-vhh-sequence-pregraph.mjs verify validation/hard-decoy-holdout-v3/vhh-sequence-pregraph-2026-08-29
      - name: Run numbering, long-CDR3, mutation, and complete matrix audits
        run: |
          node --test tests/vhh-numbering.test.mjs
          node --test tests/hard-decoy-v3-vhh-sequence-pregraph*.test.mjs
      - name: Confirm the workflow is read-only
        run: test -z "$(git status --porcelain --untracked-files=all)"
      - name: Upload the inspectable committed VHH pregraph
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hard-decoy-v3-vhh-sequence-pregraph
          path: validation/hard-decoy-holdout-v3/vhh-sequence-pregraph-2026-08-29
          if-no-files-found: error
          retention-days: 14
