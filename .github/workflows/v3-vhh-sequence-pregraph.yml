name: Hard-decoy v3 VHH sequence pregraph

on:
  push:
    branches:
      - "work/hard-decoy-v3-vhh-sequence-*"
    paths:
      - ".github/workflows/v3-vhh-sequence-pregraph.yml"
      - "scripts/hard-decoy-v3/integrate-vhh-sequence-state.mjs"
      - "scripts/hard-decoy-v3/verify-integration-state.mjs"
      - "scripts/hard-decoy/v3-vhh-sequence-pregraph.mjs"
      - "scripts/hard-decoy/v3-exact-evidence-pregraph.mjs"
      - "tests/hard-decoy-v3-integration-state.test.mjs"
      - "tests/hard-decoy-v3-vhh-sequence-pregraph*.test.mjs"
      - "tests/vhh-numbering.test.mjs"
      - "validation/hard-decoy-holdout-v3/INTEGRATION_STATE_2026-08-29.json"
      - "validation/hard-decoy-holdout-v3/VHH_SEQUENCE_PREGRAPH_ATTESTATION_2026-08-30.json"
      - "validation/hard-decoy-holdout-v3/VHH_NUMBERING_CORRECTION_2026-08-30.json"
      - "validation/hard-decoy-holdout-v3/vhh-sequence-contract-2026-08-29.json"
      - "validation/hard-decoy-holdout-v3/vhh-sequence-pregraph-2026-08-29/**"
      - "validation/hard-decoy-holdout-v3/exact-evidence-pregraph-2026-08-29/**"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hard-decoy-v3-vhh-sequence-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-integrated-pregraph:
    name: Replay integrated corrected IMGT VHH sequence pregraph
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
      - name: Use Node.js 22.18
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.18.0
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install the frozen dependency closure
        run: npm ci
      - name: Prove deterministic state integration is idempotent
        run: |
          set -euo pipefail
          script="scripts/hard-decoy-v3/integrate-vhh-sequence-state.mjs"
          test "$(sha256sum "$script" | cut -d' ' -f1)" = "2402d56b42462ea761ba06915aafba717b35216eaeb13ce8ebc7bef107b2981a"
          node --check "$script"
          node "$script"
          git diff --check
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Replay the authoritative DRAFT state and exact node universe
        run: |
          node scripts/hard-decoy-v3/verify-integration-state.mjs
          node --test tests/hard-decoy-v3-integration-state.test.mjs
          node scripts/hard-decoy/v3-exact-evidence-pregraph.mjs verify validation/hard-decoy-holdout-v3/exact-evidence-pregraph-2026-08-29
      - name: Replay corrected numbering and the complete VHH matrix
        run: |
          node scripts/hard-decoy/v3-vhh-sequence-pregraph.mjs verify validation/hard-decoy-holdout-v3/vhh-sequence-pregraph-2026-08-29
          node --test tests/vhh-numbering.test.mjs
          node --test --test-concurrency=1 tests/hard-decoy-v3-vhh-sequence-pregraph*.test.mjs
      - name: Confirm conservative authority and access boundary
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const state = JSON.parse(fs.readFileSync('validation/hard-decoy-holdout-v3/INTEGRATION_STATE_2026-08-29.json', 'utf8'));
          const attestation = JSON.parse(fs.readFileSync('validation/hard-decoy-holdout-v3/VHH_SEQUENCE_PREGRAPH_ATTESTATION_2026-08-30.json', 'utf8'));
          if (state.status !== 'DRAFT' || state.targetFreezeGate.status !== 'BLOCKED') process.exit(1);
          if (state.census.formallyClearedGroups !== 0 || attestation.formallyClearedGroupCount !== 0) process.exit(1);
          if (state.authorization.approvalReady || state.authorization.userApproved || state.authorization.executionAuthorized) process.exit(1);
          if (Object.values(state.labelBoundary).some(Boolean)) process.exit(1);
          if (state.vhhSequencePregraph.formalLeakageGraphAuthority || state.vhhSequencePregraph.formalNoEdgeAuthority || state.vhhSequencePregraph.targetEligibilityAuthority) process.exit(1);
          if (attestation.targetFreezePermitted || attestation.executionAuthorized || attestation.nativeHoldoutCoordinatesAccessed || attestation.dockqLabelsAccessed || attestation.performanceResultsAccessed) process.exit(1);
          NODE
      - name: Upload the inspectable committed VHH pregraph
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hard-decoy-v3-vhh-sequence-pregraph
          path: validation/hard-decoy-holdout-v3/vhh-sequence-pregraph-2026-08-29
          if-no-files-found: error
          retention-days: 14
