name: Hard-decoy v3 VHH sequence pregraph

on:
  push:
    branches:
      - "work/hard-decoy-v3-vhh-sequence-*"
    paths:
      - ".github/workflows/v3-vhh-sequence-pregraph.yml"
      - ".github/generated/v3-vhh-sequence-pregraph/**"
      - ".github/generated/vhh-numbering-upgrade/**"
      - "scripts/hard-decoy/upgrade-vhh-numbering-v130.mjs"
      - "scripts/hard-decoy/v3-vhh-sequence-pregraph.mjs"
      - "scripts/hard-decoy/v3-exact-evidence-pregraph.mjs"
      - "tests/hard-decoy-v3-vhh-sequence-pregraph*.test.mjs"
      - "tests/vhh-numbering.test.mjs"
      - "validation/hard-decoy-holdout-v3/VHH_NUMBERING_CORRECTION_2026-08-30.json"
      - "validation/hard-decoy-holdout-v3/vhh-sequence-contract-2026-08-29.json"
      - "validation/hard-decoy-holdout-v3/vhh-sequence-pregraph-2026-08-29/**"
      - "validation/hard-decoy-holdout-v3/exact-evidence-pregraph-2026-08-29/**"
      - "validation/hard-decoy-holdout-v3/entry-metadata-snapshot-2026-08-29/entries.jsonl"
      - "validation/hard-decoy-holdout-v3/development-metadata-snapshot-2026-08-29/entities.jsonl"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hard-decoy-v3-vhh-sequence-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate-verify-and-record:
    if: github.actor != 'github-actions[bot]'
    name: Build and verify frozen IMGT VHH sequence pregraph
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Materialize the reviewable generator source
        run: |
          set -euo pipefail
          source_parts=".github/generated/v3-vhh-sequence-pregraph"
          target="scripts/hard-decoy/v3-vhh-sequence-pregraph.mjs"
          if [[ ! -f "$target" ]]; then
            cat "$source_parts"/part-* > "$target"
          fi
          node --check "$target"
      - name: Use Node.js 22.18
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.18.0
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Apply and bind the pre-label long-CDR3 numbering correction
        run: |
          set -euo pipefail
          upgrade_template=".github/generated/vhh-numbering-upgrade/template.txt"
          upgrade_script="scripts/hard-decoy/upgrade-vhh-numbering-v130.mjs"
          {
            printf 'const profile = { profileId: "${profile.profileId}" };\n'
            printf 'const field = "${field}";\n'
            cat "$upgrade_template"
          } > "$upgrade_script"
          node --check "$upgrade_script"
          node "$upgrade_script" prepare
          npm install --package-lock-only --ignore-scripts --save-exact immunum@1.3.0
          node "$upgrade_script" bind-lock
          node --check scripts/hard-decoy/v3-vhh-sequence-pregraph.mjs
          node --check tests/hard-decoy-v3-vhh-sequence-pregraph.test.mjs
          node --check tests/hard-decoy-v3-vhh-sequence-pregraph-snapshot-audit.test.mjs
          git diff --check
      - name: Install the corrected pinned dependency closure
        run: npm ci
      - name: Verify authoritative pre-label state and exact 304-node universe
        run: |
          node scripts/hard-decoy-v3/verify-integration-state.mjs
          node scripts/hard-decoy/v3-exact-evidence-pregraph.mjs verify validation/hard-decoy-holdout-v3/exact-evidence-pregraph-2026-08-29
      - name: Generate corrected complete VHH sequence pregraph snapshot
        run: node scripts/hard-decoy/v3-vhh-sequence-pregraph.mjs generate validation/hard-decoy-holdout-v3/vhh-sequence-pregraph-2026-08-29
      - name: Run frozen numbering, long-CDR3, matrix-integrity, and independent snapshot audits
        run: |
          node --test tests/vhh-numbering.test.mjs
          node --test tests/hard-decoy-v3-vhh-sequence-pregraph*.test.mjs
      - name: Independently replay corrected VHH sequence pregraph snapshot
        run: node scripts/hard-decoy/v3-vhh-sequence-pregraph.mjs verify validation/hard-decoy-holdout-v3/vhh-sequence-pregraph-2026-08-29
      - name: Upload inspectable corrected VHH sequence pregraph
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hard-decoy-v3-vhh-sequence-pregraph
          path: validation/hard-decoy-holdout-v3/vhh-sequence-pregraph-2026-08-29
          if-no-files-found: error
          retention-days: 14
      - name: Commit corrected verified VHH sequence pregraph when changed
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          output="validation/hard-decoy-holdout-v3/vhh-sequence-pregraph-2026-08-29"
          generator="scripts/hard-decoy/v3-vhh-sequence-pregraph.mjs"
          contract="validation/hard-decoy-holdout-v3/vhh-sequence-contract-2026-08-29.json"
          correction="validation/hard-decoy-holdout-v3/VHH_NUMBERING_CORRECTION_2026-08-30.json"
          tests=(
            "tests/hard-decoy-v3-vhh-sequence-pregraph.test.mjs"
            "tests/hard-decoy-v3-vhh-sequence-pregraph-snapshot-audit.test.mjs"
          )
          source_parts=".github/generated/v3-vhh-sequence-pregraph"
          upgrade_parts=".github/generated/vhh-numbering-upgrade"
          upgrade_script="scripts/hard-decoy/upgrade-vhh-numbering-v130.mjs"
          rm -rf "$source_parts" "$upgrade_parts"
          rm -f "$upgrade_script"
          paths=("$output" "$generator" "$contract" "$correction" "package.json" "package-lock.json" "${tests[@]}" "$source_parts" "$upgrade_parts" "$upgrade_script")
          if [[ -z "$(git status --porcelain --untracked-files=all -- "${paths[@]}")" ]]; then
            echo "Corrected verified VHH sequence pregraph is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- "$output" "$generator" "$contract" "$correction" package.json package-lock.json "${tests[@]}"
          git add -A -- "$source_parts" "$upgrade_parts" "$upgrade_script"
          if git diff --cached --quiet -- "${paths[@]}"; then
            echo "No corrected VHH sequence pregraph content was staged."
            exit 1
          fi
          git commit -m "Regenerate VHH pregraph with corrected long-CDR3 numbering"
          git push origin "HEAD:${TARGET_BRANCH}"
