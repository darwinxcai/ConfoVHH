name: Bind corrected v3 VHH sequence pregraph

on:
  push:
    branches:
      - "work/hard-decoy-v3-vhh-sequence-*"
    paths:
      - ".github/workflows/v3-vhh-sequence-pregraph.yml"
      - ".github/generated/vhh-state-integration/**"
      - "scripts/hard-decoy-v3/integrate-vhh-sequence-state.mjs"
      - "scripts/hard-decoy-v3/verify-integration-state.mjs"
      - "scripts/hard-decoy/v3-vhh-sequence-pregraph.mjs"
      - "tests/hard-decoy-v3-integration-state.test.mjs"
      - "tests/hard-decoy-v3-vhh-sequence-pregraph*.test.mjs"
      - "validation/hard-decoy-holdout-v3/INTEGRATION_STATE_2026-08-29.json"
      - "validation/hard-decoy-holdout-v3/VHH_SEQUENCE_PREGRAPH_ATTESTATION_2026-08-30.json"
      - "validation/hard-decoy-holdout-v3/VHH_NUMBERING_CORRECTION_2026-08-30.json"
      - "validation/hard-decoy-holdout-v3/vhh-sequence-contract-2026-08-29.json"
      - "validation/hard-decoy-holdout-v3/vhh-sequence-pregraph-2026-08-29/**"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hard-decoy-v3-vhh-state-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bind-verify-and-record:
    if: github.actor != 'github-actions[bot]'
    name: Bind corrected VHH pregraph into authoritative DRAFT state
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Use Node.js 22.18
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.18.0
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install the frozen dependency closure
        run: npm ci
      - name: Materialize and execute the deterministic state integration
        run: |
          set -euo pipefail
          parts=".github/generated/vhh-state-integration"
          script="scripts/hard-decoy-v3/integrate-vhh-sequence-state.mjs"
          cat "$parts"/part-* > "$script"
          test "$(sha256sum "$script" | cut -d' ' -f1)" = "2402d56b42462ea761ba06915aafba717b35216eaeb13ce8ebc7bef107b2981a"
          node --check "$script"
          node "$script"
          node --check scripts/hard-decoy-v3/verify-integration-state.mjs
          node --check tests/hard-decoy-v3-integration-state.test.mjs
          git diff --check
      - name: Replay every integrated pre-label layer
        run: |
          node scripts/hard-decoy-v3/verify-integration-state.mjs
          node --test tests/hard-decoy-v3-integration-state.test.mjs
          node scripts/hard-decoy/v3-vhh-sequence-pregraph.mjs verify validation/hard-decoy-holdout-v3/vhh-sequence-pregraph-2026-08-29
          node --test tests/hard-decoy-v3-vhh-sequence-pregraph*.test.mjs
      - name: Confirm conservative authority and access boundary
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const state = JSON.parse(fs.readFileSync('validation/hard-decoy-holdout-v3/INTEGRATION_STATE_2026-08-29.json', 'utf8'));
          if (state.status !== 'DRAFT' || state.targetFreezeGate.status !== 'BLOCKED') process.exit(1);
          if (state.census.formallyClearedGroups !== 0) process.exit(1);
          if (state.authorization.approvalReady || state.authorization.userApproved || state.authorization.executionAuthorized) process.exit(1);
          if (Object.values(state.labelBoundary).some(Boolean)) process.exit(1);
          if (state.vhhSequencePregraph.formalLeakageGraphAuthority || state.vhhSequencePregraph.formalNoEdgeAuthority || state.vhhSequencePregraph.targetEligibilityAuthority) process.exit(1);
          NODE
      - name: Commit the verified integrated state
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          parts=".github/generated/vhh-state-integration"
          script="scripts/hard-decoy-v3/integrate-vhh-sequence-state.mjs"
          attestation="validation/hard-decoy-holdout-v3/VHH_SEQUENCE_PREGRAPH_ATTESTATION_2026-08-30.json"
          state="validation/hard-decoy-holdout-v3/INTEGRATION_STATE_2026-08-29.json"
          verifier="scripts/hard-decoy-v3/verify-integration-state.mjs"
          test_file="tests/hard-decoy-v3-integration-state.test.mjs"
          rm -rf "$parts"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$script" "$attestation" "$state" "$verifier" "$test_file"
          git add -A -- .github/generated
          if git diff --cached --quiet; then
            echo "The corrected VHH pregraph is already bound into the authoritative DRAFT state."
            exit 0
          fi
          git commit -m "Bind corrected VHH pregraph into v3 integration state"
          git push origin "HEAD:${TARGET_BRANCH}"
