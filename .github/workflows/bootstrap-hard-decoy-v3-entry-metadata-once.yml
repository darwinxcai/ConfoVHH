name: Bootstrap hard-decoy v3 entry metadata once

on:
  push:
    branches:
      - work/hard-decoy-v3-entry-metadata-20260829
    paths:
      - .github/workflows/bootstrap-hard-decoy-v3-entry-metadata-once.yml
      - .openai/entry-metadata-bootstrap/**

permissions:
  contents: write

concurrency:
  group: bootstrap-hard-decoy-v3-entry-metadata-once
  cancel-in-progress: false

jobs:
  bootstrap:
    if: github.repository == 'darwinxcai/ConfoVHH' && github.actor == 'darwinxcai'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out isolated work branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Use Node.js 22.18
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.18.0

      - name: Reconstruct and verify exact payload
        run: |
          set -euo pipefail
          test "$(find .openai/entry-metadata-bootstrap -maxdepth 1 -type f -name 'part-*.b64' | wc -l)" -eq 5
          cat .openai/entry-metadata-bootstrap/part-*.b64 | base64 --decode > "${RUNNER_TEMP}/entry-metadata-payload.tar.gz"
          echo "b63301d525205cea3bc0b550df0f4586ccfb53b8bbc760f2506140d0ef2a1160  ${RUNNER_TEMP}/entry-metadata-payload.tar.gz" | sha256sum --check --strict

          cat > "${RUNNER_TEMP}/expected-files.txt" <<'EOF'
          .github/workflows/hard-decoy-v3-entry-metadata.yml
          scripts/hard-decoy/v3-entry-metadata.mjs
          scripts/hard-decoy/verify-v3-entry-metadata-contracts.mjs
          tests/hard-decoy-entry-metadata-v3.test.mjs
          validation/hard-decoy-holdout-v3/entry-metadata-draft/README.md
          validation/hard-decoy-holdout-v3/entry-metadata-draft/checksums.sha256
          validation/hard-decoy-holdout-v3/entry-metadata-draft/entry-metadata-contract.json
          validation/hard-decoy-holdout-v3/entry-metadata-draft/rcsb-entry-metadata.graphql
          EOF
          tar -tzf "${RUNNER_TEMP}/entry-metadata-payload.tar.gz" | LC_ALL=C sort > "${RUNNER_TEMP}/observed-files.txt"
          diff -u "${RUNNER_TEMP}/expected-files.txt" "${RUNNER_TEMP}/observed-files.txt"
          while IFS= read -r file; do test ! -e "$file"; done < "${RUNNER_TEMP}/expected-files.txt"
          tar -xzf "${RUNNER_TEMP}/entry-metadata-payload.tar.gz"

      - name: Run source, contract, and adversarial gates
        run: |
          set -euo pipefail
          node scripts/hard-decoy/v3-source-universe.mjs verify validation/hard-decoy-holdout-v3/source-snapshot-2026-08-29
          node scripts/hard-decoy/verify-v3-entry-metadata-contracts.mjs
          node --test tests/hard-decoy-entry-metadata-v3.test.mjs

      - name: Commit tested non-workflow files
        run: |
          set -euo pipefail
          rm -rf .openai/entry-metadata-bootstrap
          rm -f .github/workflows/hard-decoy-v3-entry-metadata.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all -- \
            .openai/entry-metadata-bootstrap \
            scripts/hard-decoy/v3-entry-metadata.mjs \
            scripts/hard-decoy/verify-v3-entry-metadata-contracts.mjs \
            tests/hard-decoy-entry-metadata-v3.test.mjs \
            validation/hard-decoy-holdout-v3/entry-metadata-draft
          test -n "$(git diff --cached --name-only)"
          git commit \
            -m "Add auditable v3 entry-metadata enrichment" \
            -m "Expand the frozen 287-entry source universe into checksummed RCSB and GPCRdb metadata rows with deterministic, non-dispositive review strata. All holdout coordinate, label, approval, and execution boundaries remain closed."
          git push origin "HEAD:${GITHUB_REF_NAME}"
