name: Boltz offline compiler restore control v2

on:
  push:
    branches: [work/boltz-startup-recovery-20260909]
    paths:
      - '.github/workflows/boltz-runtime-restore-v2.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: boltz-runtime-restore-v2
  cancel-in-progress: false

jobs:
  cpu-restore-control:
    runs-on: ubuntu-22.04
    timeout-minutes: 65
    env:
      BASE: docker.io/pytorch/pytorch@sha256:2b59b1b91885677814f78be1f8df48a25d5dc952eb6580eaecfefca510f9afd3
      SOURCE_RUN: '34398379988'
      SOURCE_SHA: '257945495d8382702f2305a56e56ae662c628ef1'
      EXPECTED_BUNDLE_SHA: 'b2ea93126a22099ba7861dbd4822b29e075739c028f47934eebb98db6e6caa3c'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify exact source run and immutable artifact identities
        id: source
        env:
          GH_READ_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          mkdir -p restore-evidence restore-inputs
          git rev-parse HEAD > restore-evidence/helper-source-commit.txt
          printf '%s\n' "$SOURCE_SHA" > restore-evidence/frozen-helper-origin-commit.txt
          printf '%s\n' "$GITHUB_SHA" > restore-evidence/controller-workflow-commit.txt
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os,urllib.request
          expected={'scripts/cloud/boltz-runtime-bundle.py':'a290e798628defaceff074141f5a02fc6dbe556080f905f8bb6e7dff70def7d9','scripts/cloud/diagnose-boltz-startup.py':'82ddcbbf7f8f21855d30f909c0ef228a2a9b14da280ec6c023b07d31a47d9dba','scripts/cloud/check-boltz-runtime.py':'e0e329e1c531717307c561723b46e333f374d413ebdc7a415c30d0c8a424152a','scripts/paper/run-single-case-generation.py':'2865eea96212b3733687c2dd459bb5a48096a842e0d61361ea86617a1b0d9745'}
          for name,sha in expected.items():
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest()==sha,name
          assert Path('restore-evidence/helper-source-commit.txt').read_text().strip()==os.environ['GITHUB_SHA']
          cache_helper=Path('scripts/cloud/stage-offline-compiler-cache-v1.py')
          Path('restore-evidence/cache-stage-helper.sha256').write_text(hashlib.sha256(cache_helper.read_bytes()).hexdigest()+'\n')
          bootstrap=Path('scripts/cloud/bootstrap-ssh-preserving-base.py')
          Path('restore-evidence/bootstrap-helper.sha256').write_text(hashlib.sha256(bootstrap.read_bytes()).hexdigest()+'\n')
          api='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']
          def fetch(path):
              request=urllib.request.Request(api+path,headers={'Accept':'application/vnd.github+json','Authorization':'Bearer '+os.environ['GH_READ_TOKEN'],'X-GitHub-Api-Version':'2022-11-28'})
              with urllib.request.urlopen(request,timeout=30) as response: return json.load(response)
          run=fetch('/actions/runs/'+os.environ['SOURCE_RUN'])
          Path('restore-evidence/source-workflow-run.json').write_text(json.dumps(run,indent=2)+'\n')
          assert run['id']==int(os.environ['SOURCE_RUN']) and run['head_sha']==os.environ['SOURCE_SHA']
          assert run['status']=='completed' and run['conclusion']=='success','Source build/export run did not succeed; do not restore a failed or partial bundle'
          artifacts=fetch('/actions/runs/'+os.environ['SOURCE_RUN']+'/artifacts?per_page=100')
          Path('restore-evidence/source-artifacts.json').write_text(json.dumps(artifacts,indent=2)+'\n')
          assert artifacts['total_count']<=100,'Unexpected artifact pagination'
          names={'runtime':'confovhh-reusable-runtime-v1-'+os.environ['SOURCE_SHA'],'diagnostics':'confovhh-startup-diagnostics-v1-'+os.environ['SOURCE_SHA']}
          selected={}
          for kind,name in names.items():
              rows=[a for a in artifacts['artifacts'] if a['name']==name]
              assert len(rows)==1 and not rows[0]['expired'],'Required source artifact missing, duplicated or expired: '+name
              row=rows[0]
              assert row['workflow_run']['id']==int(os.environ['SOURCE_RUN']) and row['workflow_run']['head_sha']==os.environ['SOURCE_SHA']
              assert isinstance(row['id'],int) and 0<row['size_in_bytes']<=12884901888
              if kind=='runtime':
                  assert row['id']==10122737648 and row['size_in_bytes']==3570346126
                  assert row.get('digest')=='sha256:fa2b96fa36226ac0b497956c4d9d3948e8b0452d4de92c9cada20dc93cfb21f2'
              selected[kind]={'id':row['id'],'name':row['name'],'bytes':row['size_in_bytes'],'digest':row.get('digest')}
              with open(os.environ['GITHUB_OUTPUT'],'a') as output: output.write(kind+'_id='+str(row['id'])+'\n')
          Path('restore-evidence/selected-source-artifacts.json').write_text(json.dumps(selected,indent=2)+'\n')
          PY
      - name: Download independent source diagnostic receipt
        timeout-minutes: 10
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # Official v8.0.1
        with:
          artifact-ids: ${{ steps.source.outputs.diagnostics_id }}
          run-id: '34398379988'
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: restore-inputs/source-diagnostics
          merge-multiple: true
          digest-mismatch: error
      - name: Download reusable environment from the exact first run
        timeout-minutes: 10
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # Official v8.0.1
        with:
          artifact-ids: ${{ steps.source.outputs.runtime_id }}
          run-id: '34398379988'
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: restore-inputs/reusable
          merge-multiple: true
          digest-mismatch: error
      - name: Verify bundle against separately preserved receipt
        timeout-minutes: 12
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os,re
          source=Path('restore-inputs/source-diagnostics')
          raw=(source/'reusable-bundle.sha256').read_text().splitlines()
          assert len(raw)==1
          expected=raw[0].split()[0]
          assert re.fullmatch('[0-9a-f]{64}',expected)
          assert expected==os.environ['EXPECTED_BUNDLE_SHA']
          manifest=Path('restore-inputs/reusable/bundle.json').read_bytes()
          assert hashlib.sha256(manifest).hexdigest()==expected
          assert (source/'reusable-bundle-receipt.json').read_bytes()==manifest
          archived=json.loads(manifest)['archive']
          assert archived['bytes']==3485961842 and archived['sha256']=='fc5a2e1881f41993ab7b9e0809fb2598ec0b6346fc6ee153c2209bb8d5dc334a'
          Path('restore-evidence/source-bundle.sha256').write_text(expected+'\n')
          with open(os.environ['GITHUB_ENV'],'a') as output: output.write('BUNDLE_SHA='+expected+'\n')
          PY
          BUNDLE_SHA=$(cat restore-evidence/source-bundle.sha256)
          python3 scripts/cloud/boltz-runtime-bundle.py verify --max-seconds 660 \
            --bundle restore-inputs/reusable --expected-bundle-sha256 "$BUNDLE_SHA" \
            2>&1 | tee restore-evidence/downloaded-bundle-verification.log
          printf 'BUNDLE_BYTES_VERIFIED=true\n' >> "$GITHUB_ENV"
      - name: Pull and independently verify the exact fresh base
        timeout-minutes: 10
        run: |
          set -Eeuo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker pull --platform linux/amd64 "$BASE" 2>&1 | tee restore-evidence/base-pull.log
          docker image inspect "$BASE" > restore-evidence/base-image-inspect.json
          docker version > restore-evidence/docker-version.txt
          df -h > restore-evidence/disk-before-restore.txt
          python3 - <<'PY'
          from pathlib import Path
          from datetime import datetime,timezone
          import hashlib,json,os
          raw=Path('restore-evidence/base-image-inspect.json').read_bytes()
          rows=json.loads(raw); assert len(rows)==1
          image=rows[0]
          expected=os.environ['BASE']
          assert image['Architecture']=='amd64' and image['Os']=='linux'
          assert any(x.removeprefix('docker.io/')==expected.removeprefix('docker.io/') for x in image['RepoDigests'])
          receipt={'verified':True,'verifiedBaseImageRef':expected,'verifiedAtUtc':datetime.now(timezone.utc).isoformat(),'verificationSource':'Fresh docker pull and image inspect on standard CPU runner','imageConfigId':image['Id'],'imageInspectSha256':hashlib.sha256(raw).hexdigest(),'sourceRunId':int(os.environ['SOURCE_RUN']),'sourceCommit':os.environ['SOURCE_SHA'],'gpuRequested':False}
          Path('restore-evidence/live-base-identity.json').write_text(json.dumps(receipt,indent=2)+'\n')
          PY
      - name: Diagnose and repair captured compiler acquisition without network access
        timeout-minutes: 28
        run: |
          set -Eeuo pipefail
          trap 'docker rm -f confovhh-cpu-restore-control >/dev/null 2>&1 || true' EXIT
          docker create --name confovhh-cpu-restore-control --platform linux/amd64 \
            --entrypoint /bin/sleep -e BUNDLE_SHA \
            -v "$PWD/scripts/cloud:/helpers:ro" \
            -v "$PWD/cloud/boltz-runtime-candidate/ssh-package-plan-v1.json:/input/ssh-package-plan.json:ro" \
            -v "$PWD/restore-inputs/reusable:/bundle:ro" \
            -v "$PWD/restore-evidence:/evidence" "$BASE" infinity
          docker start confovhh-cpu-restore-control
          docker exec confovhh-cpu-restore-control /opt/conda/bin/python -I \
            /helpers/bootstrap-ssh-preserving-base.py --max-seconds 240 \
            --package-plan /input/ssh-package-plan.json --output /evidence/ssh-bootstrap
          docker network disconnect bridge confovhh-cpu-restore-control
          docker inspect confovhh-cpu-restore-control > restore-evidence/network-disconnected-container.json
          python3 - <<'PYNET'
          from pathlib import Path
          import json
          data=json.loads(Path('restore-evidence/network-disconnected-container.json').read_text())
          assert len(data)==1 and data[0]['NetworkSettings']['Networks']=={}
          PYNET
          docker exec confovhh-cpu-restore-control /bin/bash -c '
            set -Eeuo pipefail
            export CC=/usr/bin/gcc CXX=/usr/bin/g++
            /opt/conda/bin/python -I /helpers/stage-offline-compiler-cache-v1.py --max-seconds 180 \
              --bundle /bundle --expected-bundle-sha256 "$BUNDLE_SHA" --output /evidence/offline-cache-stage
            /opt/conda/bin/python -I /helpers/boltz-runtime-bundle.py restore --max-seconds 660 \
              --bundle /bundle --expected-bundle-sha256 "$BUNDLE_SHA" \
              --base-identity-receipt /evidence/live-base-identity.json --output /evidence/restore
            timeout --signal=TERM --kill-after=10s 120s /opt/confovhh-boltz/bin/python -I \
              /opt/confovhh-runtime/check-boltz-toolchain.py --compiler-only --output /evidence/compiler-only
            timeout --signal=TERM --kill-after=10s 420s /opt/conda/bin/python -I \
              /helpers/diagnose-boltz-startup.py --python /opt/confovhh-boltz/bin/python \
              --output /evidence/restored-startup
          ' 2>&1 | tee restore-evidence/restore-controller.log
      - name: Assess real restore control without asserting GPU readiness
        run: |
          set -Eeuo pipefail
          sudo chown -R "$(id -u):$(id -g)" restore-evidence
          python3 - <<'PY'
          from pathlib import Path
          from datetime import datetime,timezone
          import hashlib,json
          root=Path('restore-evidence')
          bootstrap=json.loads((root/'ssh-bootstrap/bootstrap-receipt.json').read_text())
          cache=json.loads((root/'offline-cache-stage/cache-stage-receipt.json').read_text())
          restore=json.loads((root/'restore/restore-receipt.json').read_text())
          compiler=json.loads((root/'compiler-only/receipt.json').read_text())
          startup=json.loads((root/'restored-startup/receipt.json').read_text())
          help_rows=startup['commands'][:2]
          passed=(cache['status']=='CAPTURED_ARCHIVES_STAGED_NO_DOWNLOAD_PROBE_PASSED' and cache['priorFailureReproducedWithoutInstallation'] is True and cache['packagesInstalledByThisHelper'] is False and bootstrap['status']=='BASE_PRESERVED_SSH_PREPARED' and bootstrap.get('basePackageChanges')=={} and bootstrap.get('originalPackageSelectionsRestored') is True and restore['status']=='RESTORED_REQUIRES_ORIGINAL_RUNTIME_AND_FULL_GPU_JIT' and compiler['status']=='COMPILER_ONLY_PASS' and startup['status']=='DIAGNOSTIC_COMPLETE' and len(help_rows)==2 and all(r.get('startup_completed_within_diagnostic_limit') is True for r in help_rows) and startup.get('identity_checks',{}).get('basic_pinned_identity_matches') is True)
          row={'schema':'confovhh.cpu-same-base-restore-control.v2','status':'CPU_RESTORE_CONTROL_COMPLETE' if passed else 'CPU_RESTORE_CONTROL_FAILED','completedAtUtc':datetime.now(timezone.utc).isoformat(),'sourceRunId':34398379988,'sourceCommit':'257945495d8382702f2305a56e56ae662c628ef1','offlineCacheStageStatus':cache['status'],'bootstrapStatus':bootstrap['status'],'restoreStatus':restore['status'],'compilerStatus':compiler['status'],'helpObservations':[{'command':r['command'],'elapsedSeconds':r['elapsed_seconds'],'timedOut':r['timed_out'],'completed':r.get('startup_completed_within_diagnostic_limit')} for r in help_rows],'gpuRuntimePass':False,'fullGpuJitPass':False,'predictionsLaunched':0,'frozenTimeoutOrRunnerChanged':False,'priorRuntimeFailurePreserved':True}
          (root/'cpu-restore-control-receipt.json').write_text(json.dumps(row,indent=2)+'\n')
          assert passed,'Restored CPU compiler/startup control failed; retain evidence and do not allocate a GPU'
          PY
      - name: Exercise Linux workload controller with toy processes only
        if: ${{ always() && steps.source.outcome == 'success' }}
        timeout-minutes: 3
        run: |
          set -Eeuo pipefail
          python3 scripts/cloud/test-controller-processgroups-linux.py \
            --monitor scripts/cloud/monitor-frozen-v2.py \
            --output restore-evidence/controller-processgroup-smoke
      - name: Preserve all restore evidence and checksums
        if: always()
        run: |
          set -Eeuo pipefail
          mkdir -p restore-evidence
          sudo chown -R "$(id -u):$(id -g)" restore-evidence
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          root=Path('restore-evidence')
          entries=[]
          for path in sorted(root.rglob('*')):
              if path.is_file():
                  h=hashlib.sha256()
                  with path.open('rb') as handle:
                      for chunk in iter(lambda:handle.read(1024*1024),b''): h.update(chunk)
                  entries.append({'path':path.relative_to(root).as_posix(),'bytes':path.stat().st_size,'sha256':h.hexdigest()})
          (root/'evidence-checksums.json').write_text(json.dumps(entries,indent=2)+'\n')
          assert sum(e['bytes'] for e in entries)<=12884901888,'Evidence exceeds 12 GiB storage ceiling'
          PY
      - name: Upload CPU restore receipts and raw diagnostic logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: confovhh-cpu-restore-control-v2-${{ github.sha }}
          path: |
            restore-evidence/
            !restore-evidence/restore/runtime.tar.gz
          retention-days: 1
          compression-level: 6
          if-no-files-found: error
