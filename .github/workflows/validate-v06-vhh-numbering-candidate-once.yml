name: Independent v0.6 VHH numbering candidate validation

on:
  push:
    branches:
      - accuracy/vhh-numbering-v06-candidate-20260901

permissions:
  contents: read

concurrency:
  group: validate-v06-vhh-numbering-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-candidate:
    name: Scientific release and differential · Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        node: ["22.x", "24.x"]
    steps:
      - name: Check out candidate branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Node.js ${{ matrix.node }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install frozen dependencies
        run: npm ci
      - name: Verify production dependency advisories
        run: npm audit --omit=dev --audit-level=moderate
      - name: Run full offline release gate
        run: npm run test:release
      - name: Replay blocked hard-decoy v3 integration state
        run: |
          node scripts/hard-decoy-v3/verify-integration-state.mjs
          node --test validation/hard-decoy-holdout-v3/census-audit-2026-08-29/verify.test.mjs
      - name: Reproduce the SHA-pinned public differential
        run: |
          node scripts/run-v06-vhh-numbering-public-differential.mjs
          git diff --exit-code -- validation/v0.6-vhh-numbering-candidate-v1/public-panel-differential.json
