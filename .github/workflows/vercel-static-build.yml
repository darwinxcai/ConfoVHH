name: Vercel static SPA build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  vercel-static-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install application dependencies
        run: npm ci
      - name: Build the static single-page bundle
        run: npm run build:static
      - name: Verify static output layout
        run: |
          test -f dist/static/index.html
          test -d dist/static/assets
          find dist/static/assets/workers -type f -name 'audit-worker-*.js' -print -quit | grep -q .
          find dist/static/assets/workers -type f -name 'prediction-run-worker-*.js' -print -quit | grep -q .
      - name: Verify no server runtime is emitted
        run: |
          if [ -e .vercel/output ]; then
            echo "A Build Output API directory was emitted; the static path must not produce one." >&2
            exit 1
          fi
          if find dist/static -type d -name 'functions' | grep -q .; then
            echo "The static output contains a functions directory." >&2
            exit 1
          fi
      - name: Verify the audit worker inlines the immunum WebAssembly module
        run: |
          worker="$(find dist/static/assets/workers -type f -name 'audit-worker-*.js' -print -quit)"
          grep -q 'atob(' "$worker" || {
            echo "The audit worker does not inline the immunum WebAssembly module." >&2
            exit 1
          }
          if grep -q 'readFileSync' "$worker"; then
            echo "The audit worker still carries immunum's Node-only fs loader." >&2
            exit 1
          fi
