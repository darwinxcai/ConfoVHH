name: Update public-copy assertions once

on:
  push:
    branches:
      - polish/professional-copy-20260901

permissions:
  contents: write

jobs:
  update-copy-assertions:
    if: ${{ !contains(github.event.head_commit.message, 'Update public-copy assertions') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Update copy-only test expectations
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              "tests/ui-components.test.mjs": [
                  (
                      r"/workflow—not to measure prediction accuracy or prospective ranking/",
                      r"/demonstrates interface review, not prediction accuracy or prospective ranking/",
                  ),
              ],
              "qa/tests/application.spec.mjs": [
                  (
                      r"/Audit GPCR–VHH coordinate poses/i",
                      r"/Review GPCR–VHH structural interfaces/i",
                  ),
                  (
                      r"/without treating ConfoVHH output as.*candidate-selection evidence/i",
                      r"/without presenting structural evidence as biological validation/i",
                  ),
              ],
          }

          for filename, pairs in replacements.items():
              path = Path(filename)
              text = path.read_text()
              for old, new in pairs:
                  count = text.count(old)
                  expected = 2 if filename == "qa/tests/application.spec.mjs" and old == r"/Audit GPCR–VHH coordinate poses/i" else 1
                  if count != expected:
                      raise SystemExit(f"Expected {expected} matches in {filename}, found {count}: {old}")
                  text = text.replace(old, new)
              path.write_text(text)
          PY
      - name: Verify assertion-only scope
        run: |
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' qa/tests/application.spec.mjs tests/ui-components.test.mjs | sort)"
          test "$changed" = "$expected"
      - name: Commit updated assertions and remove this workflow
        run: |
          rm .github/workflows/update-copy-tests-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qa/tests/application.spec.mjs tests/ui-components.test.mjs .github/workflows/update-copy-tests-once.yml
          git commit -m "Update public-copy assertions"
          git push origin "HEAD:${GITHUB_REF_NAME}"
