name: Hard-decoy v3 entry metadata

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - validation/hard-decoy-holdout-v3/entry-metadata-draft/**
      - validation/hard-decoy-holdout-v3/source-snapshot-2026-08-29/**
      - validation/hard-decoy-holdout-v3/SOURCE_SNAPSHOT_ATTESTATION_2026-08-29.json
      - scripts/hard-decoy/v3-entry-metadata.mjs
      - scripts/hard-decoy/verify-v3-entry-metadata-contracts.mjs
      - tests/hard-decoy-entry-metadata-v3.test.mjs
      - .github/workflows/hard-decoy-v3-entry-metadata.yml

permissions:
  contents: read

concurrency:
  group: hard-decoy-v3-entry-metadata-${{ github.ref }}
  cancel-in-progress: false

jobs:
  entry-metadata:
    name: Capture and replay exact 287-entry metadata
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 22.18
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.18.0

      - name: Reverify archived source universe
        run: >-
          node scripts/hard-decoy/v3-source-universe.mjs
          verify
          validation/hard-decoy-holdout-v3/source-snapshot-2026-08-29

      - name: Verify entry-metadata contract
        run: node scripts/hard-decoy/verify-v3-entry-metadata-contracts.mjs

      - name: Run entry-metadata integrity tests
        run: node --test tests/hard-decoy-entry-metadata-v3.test.mjs

      - name: Capture repeated public RCSB entry metadata
        run: >-
          node scripts/hard-decoy/v3-entry-metadata.mjs
          collect
          "${RUNNER_TEMP}/confovhh-hard-decoy-v3-entry-metadata"

      - name: Independently replay entry-metadata snapshot
        run: >-
          node scripts/hard-decoy/v3-entry-metadata.mjs
          verify
          "${RUNNER_TEMP}/confovhh-hard-decoy-v3-entry-metadata"

      - name: Upload checksummed entry-metadata snapshot
        if: always() && !cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: confovhh-hard-decoy-v3-entry-metadata-${{ github.run_id }}
          path: ${{ runner.temp }}/confovhh-hard-decoy-v3-entry-metadata/
          if-no-files-found: warn
          retention-days: 30
