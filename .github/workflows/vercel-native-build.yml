name: Vercel static vinext build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  vercel-static-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build Vercel static export through vinext/Vite
        run: CONFOVHH_VERCEL_STATIC=1 npx vite build
      - name: Verify static homepage and audit worker
        run: |
          test -f dist/client/index.html
          find dist/client/_next/static/workers -type f -name 'audit-worker-*.js' -print -quit | grep -q .
      - name: Smoke-test exported homepage
        run: |
          python3 -m http.server 4173 --directory dist/client >/tmp/confovhh-static-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 10); do
            if curl --fail --silent --show-error http://127.0.0.1:4173/ >/tmp/confovhh-home.html; then
              break
            fi
            sleep 1
          done
          grep -q 'ConfoVHH' /tmp/confovhh-home.html
