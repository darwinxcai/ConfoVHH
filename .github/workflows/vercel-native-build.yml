name: Vercel Nitro vinext build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  vercel-nitro-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build vinext through Nitro for Vercel
        run: CONFOVHH_VERCEL_NITRO=1 NITRO_PRESET=vercel npx vite build
      - name: Verify Vercel Build Output API bundle
        run: |
          test -d .vercel/output
          test -f .vercel/output/config.json
          test -d .vercel/output/functions/__server.func
          find .vercel/output/static/_next/static/workers -type f -name 'audit-worker-*.js' -print -quit | grep -q .
          find .vercel/output/static/_next/static/workers -type f -name 'prediction-run-worker-*.js' -print -quit | grep -q .
