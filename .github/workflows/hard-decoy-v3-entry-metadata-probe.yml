name: Hard-decoy v3 entry metadata probe

on:
  push:
    branches:
      - work/hard-decoy-v3-entry-metadata-probe-20260829
    paths:
      - .github/workflows/hard-decoy-v3-entry-metadata-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 22.18
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.18.0

      - name: Query public RCSB metadata schema
        run: |
          node --input-type=module <<'NODE'
          const query = `query EntryMetadata($ids: [String!]!) {
            entries(entry_ids: $ids) {
              rcsb_id
              struct { title }
              struct_keywords { pdbx_keywords text }
              exptl { method }
              rcsb_accession_info { initial_release_date }
              rcsb_primary_citation {
                pdbx_database_id_DOI
                pdbx_database_id_PubMed
                title
              }
              rcsb_entry_info {
                experimental_method
                resolution_combined
                polymer_entity_count
              }
              polymer_entities {
                rcsb_id
                entity_poly {
                  pdbx_seq_one_letter_code_can
                  rcsb_entity_polymer_type
                  type
                }
                rcsb_polymer_entity { pdbx_description }
                rcsb_polymer_entity_container_identifiers {
                  entity_id
                  asym_ids
                  auth_asym_ids
                  reference_sequence_identifiers {
                    database_name
                    database_accession
                    provenance_source
                  }
                }
                rcsb_entity_source_organism {
                  ncbi_scientific_name
                  ncbi_taxonomy_id
                }
              }
            }
          }`;
          const response = await fetch('https://data.rcsb.org/graphql', {
            method: 'POST',
            headers: {
              accept: 'application/json',
              'content-type': 'application/json',
              'user-agent': 'ConfoVHH-hard-decoy-v3-entry-probe/1.0'
            },
            body: JSON.stringify({ query, variables: { ids: ['3P0G', '8Q7O'] } })
          });
          const text = await response.text();
          console.log(`HTTP ${response.status}`);
          console.log(text);
          if (!response.ok) process.exit(1);
          const result = JSON.parse(text);
          if (result.errors?.length || !Array.isArray(result.data?.entries)) process.exit(1);
          NODE
