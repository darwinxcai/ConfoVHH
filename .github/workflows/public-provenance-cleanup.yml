name: Public provenance cleanup

on:
  push:
    branches:
      - maintenance/public-provenance-cleanup-20260903

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: public-provenance-cleanup-${{ github.ref }}
  cancel-in-progress: false

jobs:
  reconcile:
    if: ${{ !contains(github.event.head_commit.message, 'Apply public provenance cleanup') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out cleanup branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Use Node.js 22.18
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.18.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install frozen dependencies
        run: npm ci

      - name: Correct current provenance and state project stewardship
        run: python3 scripts/public-provenance-cleanup.py patch-files

      - name: Preserve the exact historical-lockfile disclaimer contract
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("lib/release-validation.ts")
          text = path.read_text(encoding="utf-8")
          old = "the current dependency/build environment is separately patched and is not the historical v0.5 lockfile."
          new = "the current dependency/build environment is separately patched. Byte-identical equivalence to the historical v0.5 lockfile is not claimed."
          if text.count(old) != 1:
              raise SystemExit("release-validation statement did not match exactly")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY

      - name: Commit reviewed corrections before the clean-tree release gate
        run: |
          git diff --check
          git status --short
          test -n "$(git status --porcelain)"
          git config user.name "Darwin Cai"
          git config user.email "darwinxcai@gmail.com"
          git add README.md PROVENANCE.md DEPENDENCY_POLICY.md VALIDATION.md \
            lib/release-validation.ts tests/benchmark-artifacts.test.mjs
          git commit -m "Apply public provenance cleanup (staged for validation)"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Run complete release gate from a clean committed tree
        run: npm run test:release

      - name: Remove vendor boilerplate from merged PR descriptions
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/public-provenance-cleanup.py clean-prs

      - name: Delete merged vendor-named branch refs
        run: |
          for branch in \
            claude/confovhh-static-spa-eucj9e \
            claude/pose-evidence-public-panel \
            claude/promote-v06-vhh-numbering \
            claude/record-public-panel-result
          do
            if git ls-remote --exit-code --heads origin "refs/heads/$branch" >/dev/null 2>&1; then
              git push origin --delete "$branch"
            fi
          done

      - name: Remove one-time cleanup machinery
        run: |
          rm scripts/public-provenance-cleanup.py
          rm .github/workflows/public-provenance-cleanup.yml
          git diff --check
          git config user.name "Darwin Cai"
          git config user.email "darwinxcai@gmail.com"
          git add -A scripts/public-provenance-cleanup.py \
            .github/workflows/public-provenance-cleanup.yml
          git commit -m "Apply public provenance cleanup finalization"
          git push origin "HEAD:${GITHUB_REF_NAME}"
