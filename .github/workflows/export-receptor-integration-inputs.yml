name: Export receptor integration inputs

on:
  push:
    branches:
      - "work/hard-decoy-v3-receptor-tm-pregraph-20260830"
    paths:
      - ".github/workflows/export-receptor-integration-inputs.yml"

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
      - name: Package exact integration inputs
        run: |
          set -euo pipefail
          tar -czf /tmp/receptor-integration-inputs.tar.gz \
            validation/hard-decoy-holdout-v3/INTEGRATION_STATE_2026-08-29.json \
            scripts/hard-decoy-v3/verify-integration-state.mjs \
            tests/hard-decoy-v3-integration-state.test.mjs \
            .github/workflows/v3-receptor-tm-pregraph.yml
      - name: Upload integration inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: receptor-integration-inputs
          path: /tmp/receptor-integration-inputs.tar.gz
          if-no-files-found: error
          retention-days: 1
