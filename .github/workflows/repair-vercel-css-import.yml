name: Repair Vercel CSS compatibility patch

on:
  push:
    branches:
      - fix/vercel-native-next-build-20260901

permissions:
  contents: write

jobs:
  repair-css:
    if: ${{ !contains(github.event.head_commit.message, 'Restore CSS and apply one-line Vite workaround') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Restore main CSS and apply only the Vite SSR import workaround
        run: |
          git fetch origin main --no-tags
          git show origin/main:app/globals.css > app/globals.css
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/globals.css')
          text = path.read_text()
          old = '@import "tailwindcss";\n'
          new = '@import "tailwindcss/index.css";\n'
          if not text.startswith(old):
              raise SystemExit('Unexpected main CSS first line')
          path.write_text(new + text[len(old):])
          PY
          git diff -- app/globals.css
          changed_lines="$(git diff --numstat origin/main -- app/globals.css | awk '{print $1+$2}')"
          test "$changed_lines" = "2"
      - name: Commit exact one-line compatibility patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/globals.css
          git commit -m "Restore CSS and apply one-line Vite workaround"
          git push origin "HEAD:${GITHUB_REF_NAME}"
